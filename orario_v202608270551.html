<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Orario CNOS-FAP</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh}.header{background:#fff;border-bottom:3px solid #e07800;padding:16px 24px;display:flex;align-items:center;gap:20px}.hdr-title{font-size:22px;font-weight:700;color:#1e293b;margin-bottom:2px}.hdr-sub{font-size:14px;color:#475569;font-weight:500}.toolbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:8px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}.toolbar2{background:#f8fafc;border-bottom:1px solid #e2e8f0;padding:6px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-start;position:sticky;top:45px;z-index:99}.tab-group{display:flex;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden}.tab{padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:#f8fafc;color:#64748b;transition:all .15s}.tab.active{background:#e07800;color:#fff}.fsel{padding:6px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:12px;background:#fff;cursor:pointer;color:#1e293b;min-width:160px}.btn-s{padding:6px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:#fff;color:#475569}.btn-s:hover{background:#f8fafc}.sep{width:1px;height:26px;background:#e2e8f0;flex-shrink:0}.content{padding:16px;max-width:1600px;margin:0 auto}.wpane{display:none}.wpane.active{display:block}.hidden{display:none!important}.dimmed{opacity:.1!important}.doc-table{width:100%;border-collapse:collapse;font-size:12px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}.doc-table th{background:#e07800;color:#fff;padding:8px 10px;text-align:center;font-weight:600;white-space:nowrap}.doc-table td{border:1px solid #e2e8f0;padding:6px 8px;vertical-align:top;min-width:110px;min-height:40px}.doc-table td.slot-n{background:#f8fafc;text-align:center;font-weight:700;color:#64748b;font-size:11px;width:36px;min-width:36px}.doc-cell{border-radius:5px;padding:4px 6px;font-size:11px;line-height:1.3}.doc-cell .mat{font-weight:700}.doc-cell .cls{font-size:10px;color:#fff;opacity:.85}.upd{text-align:right;font-size:10px;color:#94a3b8;margin-top:12px}@media print{.toolbar,.toolbar2,.upd{display:none!important}}@media(max-width:600px){.content{padding:8px}.toolbar,.toolbar2{gap:6px}}</style></head><body><div class="header"><div style="font-size:48px">&#x1F4DA;</div><div><div class="hdr-title">Orario lezioni</div><div class="hdr-sub">Anno scolastico 2026-2027</div></div></div><div class="toolbar"><div class="tab-group"><button class="tab active" id="tab-corso" data-mode="corso">Per corso</button><button class="tab" id="tab-doc" data-mode="doc">Per docente</button></div><div class="sep"></div><select class="fsel" id="sel-corso" onchange="applyFilters()"><option value="">Tutti i corsi</option><option value="c001">1A — 1° Anno</option><option value="c002">1B — 1° Anno B</option><option value="mqf4lzshvret8">2AC — 2° Op. dell'Acconciatura</option><option value="c005">2AU — 2° Op. Meccatronico dell'autoriparazione</option><option value="mqf4mtrwuxd7e">2LG — 2° Op. del Legno</option><option value="c003">2ME — 2° Op. Meccanico</option><option value="c004">2MS — 2° Op. Meccanico di Sistemi</option><option value="mqf4jq3erov7t">2TE — 2° Op. Trattamenti estetici</option><option value="mqw6vvf2gtnpz">3AC — 3° Op. dell'Acconciatura</option><option value="mqf4ieo91xska">3AU — 3° Op. Meccatronico dell'autoriparazione</option><option value="mqw6xatdiou5y">3LG — 3° Op. del Legno</option><option value="mqf4hel6u45ir">3ME — 3° Op. Meccanico</option><option value="mqf4hxreabb4v">3MS — 3° Op. Meccanico di Sistemi</option><option value="mqw6wko50oj09">3TE — 3° Op. Trattamenti estetici</option><option value="mqw726wk7ckkb">4AC — Acconciatore</option><option value="mqamrhj2i6b9i">4TI — Tecnico della gestione e manutenzione di macchine e impianti</option><option value="mr65ct4obsfod">4TL — Tecnico delle lavorazioni del legno</option><option value="mq69zbt5086h5">IFTS — Tecnico del disegno e della progettazione industriale</option><option value="mt9rjuttla20b">NL — Azione regionale</option><option value="mqw73kvcoad78">PRA — Praticamente</option></select><select class="fsel" id="sel-doc" onchange="applyFilters()" style="display:none"><option value="">Seleziona docente...</option><option value="d012">Almeria Simone</option><option value="mqurchvumnyfy">Artusi Cristina</option><option value="d010">Azemi Jeton</option><option value="mqurntgmx526o">Baglieri Ausilia</option><option value="d011">Bandini Matteo</option><option value="mqur7au2uyuaf">Batani Achena</option><option value="d007">Boschi Massimo</option><option value="mq6aer7tkh56f">Burnelli Andrea</option><option value="d006">Cangini Francesco</option><option value="mq6afa2ctfsa0">Cappelli Matteo</option><option value="d005">Carroli Mattia</option><option value="mqur6fl0o48eb">Castorri Sandra</option><option value="mt6zsa029gvpx">Ceccarelli Christian</option><option value="mqanjpfdr62et">Ceruti Alessandro</option><option value="mq6a7k00gx5sj">Chiodino Emanuele</option><option value="mr8txdbocqxw2">Crispino Nicola</option><option value="d014">D'Elia Cosimo</option><option value="mr65z13sxs8mu">da nominare</option><option value="mqanpxbcc37b6">Elleri Stefano</option><option value="mt6zvbhrcocam">Evangelista Marcella</option><option value="mqura8jvi6gri">Fattini Francesca</option><option value="d013">Ferrini Giacomo</option><option value="mr63dmak1pxtf">Fiuzzi Laura</option><option value="mqurdkkx418v3">Flamigni Francesca</option><option value="mr63aypoce889">Fortunati Alice</option><option value="mr63ehwb3wlwn">Foschi</option><option value="mt7003sri1wtn">Ghirelli Denise</option><option value="mqurezjewuls5">Gorini Miller</option><option value="mqurman5861c6">Larocca Federica</option><option value="mr64ex25q17l9">Mazza Noemi</option><option value="mt6zxgbwu43l0">Mazzotti Alberto</option><option value="mqurbrr6vf8de">Navacchia Barbara</option><option value="mq6ae0naewtbj">Negroni Luca</option><option value="mt7038y1tm64l">Nepoti Manuel</option><option value="mr8zb31my3h5g">Noal Riccardo</option><option value="mr8zf1o8jkyan">Perez Soledad</option><option value="mqur18rvm2p8a">Porcedda Sara</option><option value="mq6aedet7kg35">Proli Paolo</option><option value="mqurmrpdwxxlv">Resta Silvia</option><option value="mqur53esftr8z">Rolli Christian</option><option value="mqur33jct3arb">Romagnoli Carla</option><option value="mqurkwsiz7ztw">Romualdi Tania</option><option value="d009">Rossi Luca</option><option value="mrdcq0az6ittb">Saccenti Tullio Ippolito Giampio</option><option value="mqur8t3mf3eaq">Spadaccini Ilaria</option><option value="mqurlpwhxe51m">Stefanelli Stefania</option><option value="mqurgfflroiy8">Strada Monia</option><option value="mqurht5mz0byh">Tarlazzi Monica</option><option value="mqursgkal9iqu">Tartaglia Giuseppe</option><option value="mq6a4zw1npwna">Tentoni Caterina</option><option value="d015">Tioli Marco</option><option value="d004">Urselli Marco</option><option value="d016">Valbonesi Luca</option><option value="mq6a8zwf4kz4x">Volpi Alessandra</option><option value="mq6aaj2uwuj5y">Zaccarelli Walter</option></select></div><div class="toolbar2"><div class="tab-group"><button class="tab active" id="btn-w0" data-week="0">Settimana 24/08/2026 — 28/08/2026</button><button class="tab" id="btn-w1" data-week="1">Settimana 31/08/2026 — 04/09/2026</button></div><div class="sep"></div><button class="btn-s" onclick="window.print()">&#x1F5A8; Stampa</button></div><div class="content"><div id="corso-grid"><div class="wpane active" id="wpane-0"><div style="padding:32px;text-align:center;color:var(--tx3)">Nessuna lezione programmata per questa settimana nei corsi selezionati.</div></div><div class="wpane" id="wpane-1"><div style="padding:32px;text-align:center;color:var(--tx3)">Nessuna lezione programmata per questa settimana nei corsi selezionati.</div></div></div><div id="doc-grid"></div></div><div class="content"><div class="upd">Aggiornato: giovedì 27 agosto 2026</div></div><script>var _mode="corso",_week=0,_hasTwo=true;
var _sched=[[],[]];
var _WEEK_LABELS=["24/08/2026 — 28/08/2026" ,"31/08/2026 — 04/09/2026"];
var _allSlotTimes={};
var _DAY_LABELS=["","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
var _DAY_KEYS=["","lun","mar","mer","gio","ven","sab"];
function _buildSlotAxis(slots,times,RH){var sAll=Object.keys(times).map(Number).sort(function(a,b){return a-b;});var out="";slots.forEach(function(s){var sT=times[s]||"";var si=sAll.indexOf(s);var ns=sAll[si+1];var eT=ns?times[ns]||"":"";var lbl=sT?(sT+(eT?"<br>"+eT:"")):String(s);out+="<div style="height:"+RH+"px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#475569;text-align:center;border-bottom:1px solid #e2e8f0;line-height:1.5">"+lbl+"</div>";});return out;}
function setMode(m){
  _mode=m;
  ["corso","doc"].forEach(function(t){
    var el=document.getElementById("tab-"+t);if(el)el.classList.toggle("active",t===m);
  });
  document.getElementById("sel-corso").style.display=m==="corso"?"":"none";
  document.getElementById("sel-doc").style.display=m==="doc"?"":"none";
  document.getElementById("corso-grid").style.display=m==="corso"?"":"none";
  document.getElementById("doc-grid").style.display=m==="doc"?"":"none";
  applyFilters();
}
function setWeek(w){
  _week=w;
  if(_hasTwo){
    document.getElementById("wpane-0").classList.toggle("active",w===0);
    document.getElementById("wpane-1").classList.toggle("active",w===1);
  }
  ["0","1"].forEach(function(i){
    var b=document.getElementById("btn-w"+i);if(b)b.classList.toggle("active",i==w);
  });
  applyFilters();
}
function applyFilters(){
  if(_mode==="corso") filterCorso();
  else filterDoc();
}
function filterCorso(){
  var cv=document.getElementById("sel-corso").value;
  var pane=document.getElementById("wpane-"+_week);
  if(!pane)return;
  pane.querySelectorAll("[data-corso-id]").forEach(function(el){
    el.classList.toggle("hidden",!!(cv&&el.dataset.corsoId!==cv));
  });
}
function filterDoc(){
  var dv=document.getElementById("sel-doc").value;
  var dg=document.getElementById("doc-grid");
  if(!dv){dg.innerHTML="<div style="padding:24px;text-align:center;color:#94a3b8">Seleziona un docente per vedere il suo orario.</div>";return;}
  var docName=document.getElementById("sel-doc").selectedOptions[0].text;
  var entries=(_sched[_week]||[]).filter(function(e){return e.docente_id===dv||e.codocente_id===dv;});
  var slots=Array.from(new Set(entries.map(function(e){return e.slot;}))).sort(function(a,b){return a-b;});
  var DAYS=[1,2,3,4,5,6].filter(function(di){return entries.some(function(e){return _DAY_KEYS[di]===e.giorno;});});
  if(!slots.length){dg.innerHTML="<div style="padding:32px;text-align:center;color:#94a3b8">Nessuna lezione per "+docName+" questa settimana.</div>";return;}
  var DW=130,RH=64,AW=68;
  var ac=(_sched[_week]&&_sched[_week][0]&&_sched[_week][0].colore_corso)||"#cc1c1c";
  var wkLabel=(_WEEK_LABELS&&_week<_WEEK_LABELS.length)?_WEEK_LABELS[_week]:"";
  var h="<div style="background:#f1f5f9;border-top:4px solid "+ac+";padding:12px 16px;border-radius:8px 8px 0 0">";
  h+="<div style="font-size:15px;font-weight:700;color:#1e293b">&nbsp;"+docName+"</div>";
  if(wkLabel)h+="<div style="font-size:11px;color:#64748b;margin-top:3px">"+wkLabel+"</div>";
  h+="</div>";
  h+="<div style="overflow-x:auto"><div style="display:flex">";
  h+="<div style="width:"+AW+"px;flex-shrink:0"><div style="height:40px;border-bottom:2px solid #cbd5e1"></div>";
  h+=_buildSlotAxis(slots,_allSlotTimes,RH);
  h+="</div><div style="display:flex;flex:1">";
  DAYS.forEach(function(di){
    h+="<div style="width:"+DW+"px;flex-shrink:0">";
    h+="<div style="height:40px;display:flex;align-items:center;justify-content:center;background:#f0f0f0;border:1px solid #bbb;border-bottom:2px solid #bbb;font-size:12px;font-weight:600">"+_DAY_LABELS[di]+"</div>";
    slots.forEach(function(slot){
      var e=entries.find(function(x){return x.slot===slot&&_DAY_KEYS[di]===x.giorno;});
      if(!e){h+="<div style="width:"+DW+"px;height:"+RH+"px;border:1px solid #bbb;border-bottom:none;background:#f7f7f7"></div>";}
      else{
        var bg=e.colore_corso||"#3b82f6";
        h+="<div style="width:"+DW+"px;height:"+RH+"px;border:1px solid #bbb;border-bottom:none;padding:4px 8px;background:"+bg+"11;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;text-align:center">";
        h+="<div style="font-size:11px;font-weight:700;color:"+bg+"">"+e.sigla_corso+"</div>";
        h+="<div style="font-size:11px;color:#1e293b;margin-top:1px">";
        if(e.mnum)h+="<span style="font-size:9px;color:#64748b;margin-right:2px">"+e.mnum+"</span>";
        h+=e.materia+"</div>";
        if(e.aula)h+="<div style="font-size:9px;color:#64748b;margin-top:1px">"+e.aula+"</div>";
        if(e.codocente_id===dv)h+="<div style="font-size:9px;color:#64748b">codocente</div>";
        h+="</div>";
      }
    });
    h+="</div>";
  });
  h+="</div></div></div>";
  dg.innerHTML=h;
}

document.addEventListener("DOMContentLoaded",function(){
  document.querySelectorAll("[data-mode]").forEach(function(b){
    b.addEventListener("click",function(){setMode(this.dataset.mode);});
  });
  document.querySelectorAll("[data-week]").forEach(function(b){
    b.addEventListener("click",function(){setWeek(parseInt(this.dataset.week));});
  });
  setWeek(0);
  document.getElementById("doc-grid").style.display="none";
});</script></body></html>
